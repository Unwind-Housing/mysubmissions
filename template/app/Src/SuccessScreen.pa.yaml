Screens:
  SuccessScreen:
    Properties:
      Fill: =RGBA(244, 246, 248, 1)
      Height: =Max(App.Height, 720 * Z)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - TutorialText1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(40, 40, 40, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =80 * Z
            LineHeight: =1.3
            PaddingLeft: =20 * Z
            PaddingRight: =20 * Z
            Size: =40 * Z
            Text: ="Submitted"
            Width: =640 * Z
            X: =(Parent.Width - 640 * Z) / 2
            Y: =330 * Z
      - iconPrev1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(40, 122, 54, 1)
            FocusedBorderThickness: =2 * Z
            Height: =140 * Z
            Icon: =Icon.CheckBadge
            TabIndex: =0
            Tooltip: ="Previous step"
            Width: =140 * Z
            X: =(Parent.Width - 640 * Z) / 2 + 250 * Z
            Y: =170 * Z
      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            FocusedBorderThickness: =4 * Z
            Font: =Font.'Open Sans'
            Height: =68 * Z
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -15%)
            OnSelect: =Navigate(LandingPage)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8 * Z
            RadiusBottomRight: =8 * Z
            RadiusTopLeft: =8 * Z
            RadiusTopRight: =8 * Z
            Size: =22 * Z
            Text: ="Back to home"
            Width: =580 * Z
            X: =(Parent.Width - Self.Width) / 2
            Y: =500 * Z
      - lblSuccessSub:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(96, 96, 96, 1)
            Font: =Font.'Open Sans'
            Height: =48 * Z
            LineHeight: =1.3
            PaddingLeft: =20 * Z
            PaddingRight: =20 * Z
            Size: =18 * Z
            Text: ="Thanks. It's on its way for approval."
            Width: =640 * Z
            X: =(Parent.Width - 640 * Z) / 2
            Y: =410 * Z
