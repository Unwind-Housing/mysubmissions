              =If(IsBlank(ProjectDropDown.Selected) || IsBlank(CostAccountDropdown.Selected), Notify(If(gblDeposit, "Please choose a Cost Account", "Please choose a Project and a Cost Account"), NotificationType.Error), If(
                  CountRows(AttachmentsControl.Attachments) = 0,
                  If(
                      Confirm("No attachment found. Do you want to submit anyway?"),
                      SubmitForm(FinancialThingForm)
                  ),
                  SubmitForm(FinancialThingForm)
              ))
