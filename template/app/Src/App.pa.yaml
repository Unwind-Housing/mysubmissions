App:
  Properties:
    BackEnabled: =false
    Formulas: |-
      =Z = If(App.Width < 640 || (App.Width < 1000 && App.Height > App.Width), App.Width / 640, Min(1.6, Max(1, App.Width / 1150)));
      Phone = App.Width < 640 || (App.Width < 1000 && App.Height > App.Width);
      HB = If(Phone, 88 * Z, 64 * Z);
    MinScreenHeight: =1136
    MinScreenWidth: =320
    OnStart: = Set(CurrentUser, User())
    Theme: =PowerAppsTheme
