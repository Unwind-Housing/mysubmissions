Screens:
  FinancialApprovals:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =If(Self.Width >= 1000, Max(App.Height, 640 * Z), 2516 * Z)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =If(!(__MS_IS_FINANCIAL_APPROVER__), Notify("That page is for approvers.", NotificationType.Warning); Navigate(LandingPage))
    Children:
      - RectQuickActionBar5:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(__MS_HEADER_RGB__, 1)
            Height: =HB
            Width: =Parent.Width
      - ApprovalsGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =false
            Height: =If(Parent.Width >= 1000, Parent.Height - HB - 176 * Z, 640 * Z)
            Items: |+
              =Filter('Financial Submissions','Type of thing'.Value = "Receipt" || 'Type of thing'.Value = "Invoice" || 'Type of thing'.Value = "Deposit" || 'Type of thing'.Value = "Reimbursement",Processed=false)
            OnSelect: |-
              =UpdateContext({locAtt: 1}); Reset(cmbPanelProject); Reset(cmbPanelAccount); Reset(txtPanelComments)
            TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 240, 250, 1), RGBA(0, 0, 0, 0))
            TemplateSize: =140 * Z
            Width: =If(Parent.Width >= 1000, RoundDown(Parent.Width / 2, 0), Parent.Width)
            Y: =HB
          Children:
            - Title16:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(IsBlank(ThisItem.'Cost Account'.Value), RGBA(168, 0, 0, 1), RGBA(0, 0, 0, 1))
                  Font: =Font.'Open Sans'
                  Height: =30 * Z
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =16 * Z
                  Text: =If(IsBlank(ThisItem.'Cost Account'.Value), "No project or cost account", If(IsBlank(ThisItem.'Cost Account'.Value), "", ThisItem.Project.Value & " - " & ThisItem.'Cost Account'.Value))
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 250 * Z
                  Wrap: =false
                  X: =20 * Z
                  Y: =90 * Z
            - Subtitle13:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 96, 96, 1)
                  Font: =Font.'Open Sans'
                  Height: =30 * Z
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =16 * Z
                  Text: =ThisItem.'Type of thing'.Value & "  ·  " & ThisItem.'Created By'.DisplayName
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 250 * Z
                  Wrap: =false
                  X: =20 * Z
                  Y: =56 * Z
            - Body6:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =Switch(ThisItem.'Type of thing'.Value, "Invoice", RGBA(168, 0, 0, 1), "Reimbursement", RGBA(168, 0, 0, 1), "Deposit", RGBA(0, 128, 0, 1), RGBA(0, 0, 0, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =36 * Z
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =19 * Z
                  Text: |-
                    =Text(ThisItem.Amount, "[$-en-US]$ #,###.00")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =240 * Z
                  X: =Parent.TemplateWidth - 260 * Z
                  Y: =18 * Z
            - Separator16:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 228, 1)
                  FocusedBorderThickness: =2 * Z
                  Height: =1 * Z
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle16:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator16.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4 * Z
            - Title16_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(168, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  Height: =40 * Z
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =22 * Z
                  Text: =ThisItem.Vendor
                  Width: =Parent.TemplateWidth - 290 * Z
                  Wrap: =false
                  X: =20 * Z
                  Y: =12 * Z
            - Checkbox1:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(54, 176, 75, 1)
                  CheckboxSize: =34 * Z
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Color: =If(ThisItem.Approved, RGBA(0, 128, 0, 1), RGBA(96, 96, 96, 1))
                  Default: =ThisItem.Approved
                  FocusedBorderThickness: =2 * Z
                  Font: =Font.'Open Sans'
                  Height: =48 * Z
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: |-
                    =If(!ThisItem.Approved, With({r: LookUp('Financial Submissions', ID = ThisItem.ID)}, Patch('Financial Submissions', r, {Approved: true})); Refresh('Financial Submissions'))
                  OnSelect: =Select(Parent)
                  OnUncheck: |-
                    =If(ThisItem.Approved, With({r: LookUp('Financial Submissions', ID = ThisItem.ID)}, Patch('Financial Submissions', r, {Approved: false})); Refresh('Financial Submissions'))
                  Size: =17 * Z
                  Text: =If(ThisItem.Approved, "Approved", "Approve")
                  Width: =160 * Z
                  X: =Parent.TemplateWidth - 180 * Z
                  Y: =72 * Z
            - Subtitle13_4:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14 * Z
                  Text: =ThisItem.'Created By'.DisplayName
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =false
                  Width: =Title16.Width
                  X: =28 * Z
                  Y: =82 * Z
      - LblAppName5:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(__MS_HEADER_TEXT_RGB__, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =HB
            Size: =If(Phone, 28 * Z, 24 * Z)
            Text: ="Open Financial Approvals"
            Width: =Parent.Width - Self.X - 140 * Z
            X: =Max(If(Phone, 104 * Z, 84 * Z), (Parent.Width - 640 * Z) / 2 + 16 * Z)
      - Label4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =100 * Z
            PaddingBottom: =5 * Z
            PaddingLeft: =5 * Z
            PaddingRight: =5 * Z
            PaddingTop: =5 * Z
            Size: =14 * Z
            Text: =Text(Coalesce(Sum(Filter(ApprovalsGallery.AllItems, 'Type of thing'.Value = "Invoice"), Amount), 0), "[$-en-US]$#,##0.00") & Char(10) & Text(Coalesce(Sum(Filter(ApprovalsGallery.AllItems, 'Type of thing'.Value = "Deposit"), Amount), 0), "[$-en-US]$#,##0.00") & Char(10) & Text(Coalesce(Sum(Filter(ApprovalsGallery.AllItems, 'Type of thing'.Value = "Receipt"), Amount), 0), "[$-en-US]$#,##0.00") & Char(10) & Text(Coalesce(Sum(Filter(ApprovalsGallery.AllItems, 'Type of thing'.Value = "Reimbursement"), Amount), 0), "[$-en-US]$#,##0.00")
            Width: =120 * Z
            X: =ApprovalsGallery.Width / 2 + 30 * Z + 12 * Z
            Y: =Rectangle1.Y + 10 * Z
      - Label5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =100 * Z
            PaddingBottom: =5 * Z
            PaddingLeft: =5 * Z
            PaddingRight: =5 * Z
            PaddingTop: =5 * Z
            Size: =14 * Z
            Text: ="Invoices" & Char(10) & "Deposits" & Char(10) & "Receipts" & Char(10) & "Reimbursements"
            Width: =220 * Z
            X: =ApprovalsGallery.Width / 2 + 30 * Z - 232 * Z
            Y: =Rectangle1.Y + 10 * Z
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(205, 210, 215, 1)
            FocusedBorderThickness: =2 * Z
            Height: =2 * Z
            Width: =ApprovalsGallery.Width - 32 * Z
            X: =16 * Z
            Y: =ApprovalsGallery.Y + ApprovalsGallery.Height + 8 * Z
      - icon_back:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(__MS_HEADER_TEXT_RGB__, 1)
            FocusedBorderThickness: =2 * Z
            Height: =If(Phone, 76 * Z, 56 * Z)
            Icon: =Icon.ArrowLeft
            OnSelect: =Navigate(LandingPage)
            PaddingBottom: =If(Phone, 16 * Z, 10 * Z)
            PaddingLeft: =If(Phone, 16 * Z, 10 * Z)
            PaddingRight: =If(Phone, 16 * Z, 10 * Z)
            PaddingTop: =If(Phone, 16 * Z, 10 * Z)
            Tooltip: ="Back"
            Width: =If(Phone, 76 * Z, 56 * Z)
            X: =22 * Z
            Y: =(HB - Self.Height) / 2
      - PanelBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(244, 246, 248, 1)
            FocusedBorderThickness: =2 * Z
            Height: =If(Parent.Width >= 1000, Parent.Height - HB, 1500 * Z)
            Width: =Parent.Width - Self.X
            X: =If(Parent.Width >= 1000, ApprovalsGallery.Width, 0)
            Y: =If(Parent.Width >= 1000, HB, Label4.Y + 166 * Z)
      - icoRefresh:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(__MS_HEADER_TEXT_RGB__, 1)
            FocusedBorderThickness: =2 * Z
            Height: =If(Phone, 44 * Z, 36 * Z)
            Icon: =Icon.Reload
            OnSelect: =Refresh('Financial Submissions')
            Tooltip: ="Refresh the list"
            Width: =If(Phone, 44 * Z, 36 * Z)
            X: =LblAppName5.X + Len(LblAppName5.Text) * If(Phone, 19.8 * Z, 17 * Z) + 14 * Z
            Y: =(HB - Self.Height) / 2
      - conPanelScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =PanelBg.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =PanelBg.Width
            X: =PanelBg.X
            Y: =PanelBg.Y
          Children:
            - conPanel:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =chkPanelApproved.Y + chkPanelApproved.Height + 8 * Z + If(CountRows(ApprovalsGallery.Selected.Attachments) > 1, 44 * Z, 0) + If(pdfPreview.Visible || imgPreview.Visible, pdfPreview.Height, If(CountRows(ApprovalsGallery.Selected.Attachments) > 0, 110 * Z, 0)) + 24 * Z
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblSelVendor:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(56, 96, 178, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =50 * Z
                        PaddingBottom: =5 * Z
                        PaddingLeft: =5 * Z
                        PaddingRight: =5 * Z
                        PaddingTop: =5 * Z
                        Size: =28 * Z
                        Text: =If(IsBlank(ApprovalsGallery.Selected.ID), "Nothing waiting for approval", ApprovalsGallery.Selected.Vendor)
                        Width: =Parent.Width - 64 * Z - 48 * Z
                        X: =0 + 32 * Z
                        Y: =0 + 28 * Z
                  - lblSelDetails:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(96, 96, 96, 1)
                        Font: =Font.'Open Sans'
                        Height: =36 * Z
                        PaddingBottom: =5 * Z
                        PaddingLeft: =5 * Z
                        PaddingRight: =5 * Z
                        PaddingTop: =5 * Z
                        Size: =18 * Z
                        Text: =If(IsBlank(ApprovalsGallery.Selected.ID), "", ApprovalsGallery.Selected.'Type of thing'.Value & " · " & Text(ApprovalsGallery.Selected.Amount, "[$-en-US]$#,##0.00") & If(IsBlank(ApprovalsGallery.Selected.'Invoice Number'), "", " · Invoice " & ApprovalsGallery.Selected.'Invoice Number') & If(IsBlank(ApprovalsGallery.Selected.'Invoice Date'), "", " · " & Text(ApprovalsGallery.Selected.'Invoice Date', "[$-en-US]mm/dd/yyyy")))
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelVendor.Y + lblSelVendor.Height
                  - lblSelAccount:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(168, 0, 0, 1)
                        Font: =Font.'Open Sans'
                        Height: =36 * Z
                        PaddingBottom: =5 * Z
                        PaddingLeft: =5 * Z
                        PaddingRight: =5 * Z
                        PaddingTop: =5 * Z
                        Size: =18 * Z
                        Text: =If(IsBlank(ApprovalsGallery.Selected.ID) || !IsBlank(ApprovalsGallery.Selected.'Cost Account'.Value), "", IsBlank(ApprovalsGallery.Selected.Project.Value), "No project or cost account", "No cost account")
                        Visible: =!IsBlank(ApprovalsGallery.Selected.ID) && IsBlank(ApprovalsGallery.Selected.'Cost Account'.Value)
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelDetails.Y + lblSelDetails.Height
                  - lblSelSubmitted:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(96, 96, 96, 1)
                        Font: =Font.'Open Sans'
                        Height: =32 * Z
                        PaddingBottom: =5 * Z
                        PaddingLeft: =5 * Z
                        PaddingRight: =5 * Z
                        PaddingTop: =5 * Z
                        Size: =16 * Z
                        Text: =If(IsBlank(ApprovalsGallery.Selected.ID), "", "Submitted by " & ApprovalsGallery.Selected.'Created By'.DisplayName & " on " & Text(ApprovalsGallery.Selected.Created, "[$-en-US]mm/dd/yyyy"))
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =cmbPanelAccount.Y + cmbPanelAccount.Height + 8 * Z + If(btnPanelSaveAcct.Visible, 52 * Z, 0)
                  - lblSelAttachHead:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =32 * Z
                        PaddingBottom: =5 * Z
                        PaddingLeft: =5 * Z
                        PaddingRight: =5 * Z
                        PaddingTop: =5 * Z
                        Size: =16 * Z
                        Text: =If(CountRows(ApprovalsGallery.Selected.Attachments) = 0, "No attachments", "Attachments (" & CountRows(ApprovalsGallery.Selected.Attachments) & ")")
                        Visible: =!IsBlank(ApprovalsGallery.Selected.ID)
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelOpenItem.Y + lblSelOpenItem.Height + 8 * Z
                  - lblSelAttach1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =RGBA(0, 103, 184, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4 * Z
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =30 * Z
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =ColorFade(Self.Color, -30%)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: =Launch(Last(FirstN(ApprovalsGallery.Selected.Attachments, 1)).AbsoluteUri)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =16 * Z
                        Text: =Last(FirstN(ApprovalsGallery.Selected.Attachments, 1)).DisplayName
                        Underline: =true
                        Visible: =CountRows(ApprovalsGallery.Selected.Attachments) >= 1
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelAttachHead.Y + lblSelAttachHead.Height + 0 * Z
                  - lblSelAttach2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =RGBA(0, 103, 184, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4 * Z
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =30 * Z
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =ColorFade(Self.Color, -30%)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: =Launch(Last(FirstN(ApprovalsGallery.Selected.Attachments, 2)).AbsoluteUri)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =16 * Z
                        Text: =Last(FirstN(ApprovalsGallery.Selected.Attachments, 2)).DisplayName
                        Underline: =true
                        Visible: =CountRows(ApprovalsGallery.Selected.Attachments) >= 2
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelAttachHead.Y + lblSelAttachHead.Height + 34 * Z
                  - lblSelAttach3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =RGBA(0, 103, 184, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4 * Z
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =30 * Z
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =ColorFade(Self.Color, -30%)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: =Launch(Last(FirstN(ApprovalsGallery.Selected.Attachments, 3)).AbsoluteUri)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =16 * Z
                        Text: =Last(FirstN(ApprovalsGallery.Selected.Attachments, 3)).DisplayName
                        Underline: =true
                        Visible: =CountRows(ApprovalsGallery.Selected.Attachments) >= 3
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelAttachHead.Y + lblSelAttachHead.Height + 68 * Z
                  - lblSelOpenItem:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =RGBA(0, 103, 184, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4 * Z
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =30 * Z
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =ColorFade(Self.Color, -30%)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: =Launch("__MS_LISTS_SITE__/Lists/Financial%20Submissions/DispForm.aspx?ID=" & ApprovalsGallery.Selected.ID)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =15 * Z
                        Text: =If(CountRows(ApprovalsGallery.Selected.Attachments) > 3, "Open the item in SharePoint to see all " & CountRows(ApprovalsGallery.Selected.Attachments) & " attachments", "Open the item in SharePoint")
                        Underline: =true
                        Visible: =!IsBlank(ApprovalsGallery.Selected.ID)
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =txtPanelComments.Y + txtPanelComments.Height + 12 * Z
                  - rectApproveDivider:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(205, 210, 215, 1)
                        FocusedBorderThickness: =2 * Z
                        Height: =1 * Z
                        Visible: =!IsBlank(ApprovalsGallery.Selected.ID)
                        Width: =Parent.Width - 64 * Z
                        X: =0 + 32 * Z
                        Y: =lblSelAttachHead.Y + lblSelAttachHead.Height + Min(CountRows(ApprovalsGallery.Selected.Attachments), 3) * 34 * Z + 12 * Z
                  - chkPanelApproved:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        CheckboxBorderColor: =RGBA(54, 176, 75, 1)
                        CheckboxSize: =56 * Z
                        CheckmarkFill: =RGBA(0, 0, 0, 1)
                        Default: =ApprovalsGallery.Selected.Approved
                        FocusedBorderThickness: =2 * Z
                        Font: =Font.'Open Sans'
                        Height: =80 * Z
                        HoverColor: =RGBA(0, 18, 107, 1)
                        OnCheck: |-
                          =If(!ApprovalsGallery.Selected.Approved, With({r: LookUp('Financial Submissions', ID = ApprovalsGallery.Selected.ID)}, Patch('Financial Submissions', r, {Approved: true})); Refresh('Financial Submissions'))
                        OnUncheck: |-
                          =If(ApprovalsGallery.Selected.Approved, With({r: LookUp('Financial Submissions', ID = ApprovalsGallery.Selected.ID)}, Patch('Financial Submissions', r, {Approved: false})); Refresh('Financial Submissions'))
                        Size: =24 * Z
                        Text: ="Approved"
                        Visible: =!IsBlank(ApprovalsGallery.Selected.ID)
